// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    dependencies {
        // AGP 9's built-in Kotlin support bundles its own Kotlin Gradle Plugin version;
        // pin it to the version catalog's Kotlin version so :app/:data compile with the
        // same Kotlin version as the plain-JVM :domain module.
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${libs.versions.kotlin.get()}")
    }
}

plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.jvm) apply false
    alias(libs.plugins.ksp) apply false
    alias(libs.plugins.hilt) apply false
    alias(libs.plugins.navigation.safeargs) apply false
}

tasks.register("clean", Delete) {
    delete(rootProject.layout.buildDirectory)
}

plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt)
}

// Room exports the schema of every version to JSON here, and those files are committed. They are
// the baseline each future Migration is written and tested against; a schema that was never
// exported cannot be reconstructed after the fact, so this has to be in place BEFORE the first
// version bump rather than when one is finally needed.
ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

android {
    namespace = 'com.khiemnph.data'
    compileSdk = libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.targetSdk.get().toInteger()

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        // MigrationTestHelper reads the exported schemas from the unit-test assets.
        test.assets.srcDirs += files("$projectDir/schemas")
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    api project(":domain")
    implementation libs.androidx.core.ktx

    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler

    implementation libs.hilt.android
    ksp libs.hilt.compiler

    implementation libs.kotlinx.coroutines.android

    implementation libs.play.services.location

    testImplementation libs.junit
    testImplementation libs.mockk
    testImplementation libs.turbine
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.robolectric
    testImplementation libs.androidx.room.testing
    testImplementation libs.androidx.test.ext.junit
    testImplementation testFixtures(project(":domain"))

    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.espresso.core
}

// `check` compiles unit tests but not androidTest, which is how the instrumented suite silently
// stopped compiling during the Compose migration and stayed broken without anything going red.
// Compiling it here turns that back into a build failure.
tasks.named('check') { dependsOn 'assembleDebugAndroidTest' }
